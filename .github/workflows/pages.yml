name: pages

# Web app for iPhone/iPad and any browser (ADR-016): built on each release
# tag and deployed to GitHub Pages (https://leejaegyung.github.io/eng-talk-/).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: flutter build web
        run: |
          name="${GITHUB_REF_NAME#v}"
          args=(--release --base-href "/${{ github.event.repository.name }}/")
          [[ "$GITHUB_REF_TYPE" == tag ]] && args+=(--build-name "$name")
          # The version this page was built as; version.json next to it says
          # what's deployed now (ADR-018).
          [[ "$GITHUB_REF_TYPE" == tag ]] || name="$(sed -n 's/^version: *\([^+]*\).*/\1/p' pubspec.yaml)"
          args+=(--dart-define=APP_VERSION="$name")
          flutter build web "${args[@]}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/flutter_app/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
