name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cd apps/flutter_app && flutter pub get
      - run: scripts/check.sh

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos-latest
            artifact: apps/flutter_app/build/macos/Build/Products/Release/speaking_coach.app
          - target: windows
            os: windows-latest
            artifact: apps/flutter_app/build/windows/x64/runner/Release
          - target: apk
            os: ubuntu-latest
            artifact: apps/flutter_app/build/app/outputs/flutter-apk/app-release.apk
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Unsigned builds until the distribution decision (ADR-006).
      - run: flutter build ${{ matrix.target }} --release
      - uses: actions/upload-artifact@v4
        with:
          name: speaking_coach-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          retention-days: 14
