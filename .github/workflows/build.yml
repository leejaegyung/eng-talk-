name: build

# Reusable: check + release builds for macOS, Windows, Android and iOS.
# Each target uploads one installable file as artifact `speaking_coach-<target>`.
on:
  workflow_call:
    inputs:
      build-name:
        description: "Version shown in the app (e.g. 0.1.0). Empty = pubspec value."
        type: string
        default: ""
      build-number:
        description: "Monotonic build number (Android versionCode). Empty = pubspec value."
        type: string
        default: ""

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: cd apps/flutter_app && flutter pub get
      - run: scripts/check.sh

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            os: macos-latest
          - target: windows
            os: windows-latest
          - target: apk
            os: ubuntu-latest
          # Unsigned: install by signing with your own Apple ID (ADR-012).
          - target: ios
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: apps/flutter_app
    env:
      BUILD_NAME: ${{ inputs.build-name }}
      BUILD_NUMBER: ${{ inputs.build-number }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        if: matrix.target == 'apk'
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Android: the fixed release key (ADR-006) from repository secrets, if
      # set; without it the APK falls back to a per-run debug key.
      - name: android release key
        if: matrix.target == 'apk'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [[ -n "$KEYSTORE_B64" ]]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 not set - APK signed with a debug key"
          fi
      # macOS/Windows/iOS stay unsigned for personal installs (ADR-006).
      - name: flutter build
        run: |
          args=()
          [[ -n "$BUILD_NAME" ]] && args+=(--build-name "$BUILD_NAME")
          [[ -n "$BUILD_NUMBER" ]] && args+=(--build-number "$BUILD_NUMBER")
          [[ "${{ matrix.target }}" == ios ]] && args+=(--no-codesign)
          flutter build ${{ matrix.target }} --release "${args[@]}"
      - name: package
        run: |
          version="${BUILD_NAME:-dev}"
          mkdir -p dist
          case "${{ matrix.target }}" in
            macos)
              ditto -c -k --keepParent build/macos/Build/Products/Release/speaking_coach.app \
                "dist/SpeakingCoach-$version-macos.zip" ;;
            windows)
              (cd build/windows/x64/runner/Release && 7z a -tzip "$GITHUB_WORKSPACE/apps/flutter_app/dist/SpeakingCoach-$version-windows-x64.zip" .) ;;
            apk)
              cp build/app/outputs/flutter-apk/app-release.apk "dist/SpeakingCoach-$version-android.apk" ;;
            ios)
              mkdir -p build/ipa/Payload
              cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
              (cd build/ipa && zip -qry "$GITHUB_WORKSPACE/apps/flutter_app/dist/SpeakingCoach-$version-ios-unsigned.ipa" Payload) ;;
          esac
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: speaking_coach-${{ matrix.target }}
          path: apps/flutter_app/dist/*
          retention-days: 14
