include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - macos/**
    - "**/*.g.dart"
    - windows/**
    - ios/**
    - web/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    avoid_print: error

linter:
  rules:
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - always_declare_return_types
    - unawaited_futures
    - directives_ordering
